# Radika con su propia base de datos, para un servidor unico o para probar en tu computador.
#   1. cp .env.example .env   y completa RADIKA_API_KEYS y POSTGRES_PASSWORD (mas lo opcional)
#   2. docker compose up -d --build
# Si usas una base de datos externa, quita el servicio "db" y define DATABASE_URL en .env.
services:
  radika:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://radika:${POSTGRES_PASSWORD}@db:5432/radika}
    ports: ["127.0.0.1:${PORT:-3000}:${PORT:-3000}"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: radika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: radika
    volumes: ["radika_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radika -d radika"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  radika_db:
